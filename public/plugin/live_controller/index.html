<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Controller</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="container">
      <div class="connect_obs">
        <input type="text" id="obs_ip" placeholder="IP Address" />
        <input
          class="input_port"
          type="text"
          id="obs_port"
          placeholder="Port"
        />
        <input type="password" id="obs_paddword" placeholder="Password" />
        <button type="button" class="btn" id="btn_connect">Connect</button>
      </div>
      <div id="controller_status" role="status" aria-live="polite" hidden></div>
      <div class="btns">
        <div class="cam_1_prv" onclick="obs_command('CAM_1_PRV')">
          <i class="bi bi-camera-reels"></i>
          <lable>CAM 01</lable>
        </div>
        <div class="cam_2_prv" onclick="obs_command('CAM_2_PRV')">
          <i class="bi bi-camera-reels"></i>
          <lable>CAM 02</lable>
        </div>
        <div class="cam_3_prv" onclick="obs_command('CAM_3_PRV')">
          <i class="bi bi-camera-reels"></i>
          <lable>CAM 03</lable>
        </div>
        <div class="cam_4_prv prv" onclick="obs_command('CAM_4_PRV')">
          <i class="bi bi-camera-reels"></i>
          <lable>CAM 04</lable>
        </div>
        <div class="btn_intro_prv" onclick="obs_command('INTRO_PRV')">
          <i class="bi bi-film"></i>
          <lable>INTRO</lable>
        </div>
        <div class="btn_cut" onclick="obs_command('CUT')">
          <lable>CUT</lable>
        </div>
        <div class="cam_1_pgm" onclick="obs_command('CAM_1_PGM')">
          <i class="bi bi-camera-reels"></i>
          <lable>CAM 01</lable>
        </div>
        <div class="cam_2_pgm pgm" onclick="obs_command('CAM_2_PGM')">
          <i class="bi bi-camera-reels"></i>
          <lable>CAM 02</lable>
        </div>
        <div class="cam_3_pgm" onclick="obs_command('CAM_3_PGM')">
          <i class="bi bi-camera-reels"></i>
          <lable>CAM 03</lable>
        </div>
        <div class="cam_4_pgm" onclick="obs_command('CAM_4_PGM')">
          <i class="bi bi-camera-reels"></i>
          <lable>CAM 04</lable>
        </div>
        <div class="btn_intro" onclick="obs_command('INTRO')">
          <i class="bi bi-film"></i>
          <lable>INTRO</lable>
        </div>
        <div class="btn_auto" onclick="obs_command('AUTO')">
          <lable>AUTO</lable>
        </div>
        <div class="btn_01" onclick="remote_command('nameplate')">
          <lable>Name</lable>
        </div>
        <div class="btn_02" onclick="remote_command('BIB')">
          <lable>BIB</lable>
        </div>
        <div class="btn_03" onclick="remote_command('BIB_M')">
          <lable>BIB M</lable>
        </div>
        <div class="btn_04" onclick="remote_command('Lyrics')">
          <lable>Lyrics</lable>
        </div>
        <div class="btn_05" onclick="remote_command('Caption')">
          <lable>Caption</lable>
        </div>
        <div class="btn_06" onclick="remote_command('SideB')">
          <lable>SideB</lable>
        </div>
        <div class="btn_07" onclick="remote_command('Transition')">
          <lable>Transition</lable>
        </div>
        
      </div>
    </div>
  </body>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>
</html>
