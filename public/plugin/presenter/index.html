<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter Control</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/mobile-system.css">
  <style>
    body {
      background: #0b1620;
      color: #e8eef4;
    }

    .card {
      background: #12222f;
      border: 1px solid #1e3a4d;
      border-radius: 12px;
    }

    .slide-frame {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
      background: #000;
      border-radius: 8px;
    }

    .chat-box {
      height: 200px;
      overflow-y: auto;
      background: #0e1c27;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #1e3a4d;
    }

    .chat-msg {
      margin-bottom: 8px;
    }

    .chat-msg .from {
      font-weight: bold;
      color: #ffd166;
    }

    .badge-live {
      background: #e74c3c;
    }

    .status-bar {
      font-size: .9rem;
      color: #9fb6c6;
    }

    .list-group-item {
      background: #0e1c27;
      border-color: #1e3a4d;
      color: #e8eef4;
    }

    .notes-view {
      background: #0e1c27;
      color: #e8eef4;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #1e3a4d;
      min-height: 120px;
      white-space: pre-wrap;
    }

    .card, .card h6, .card .form-label, .card .form-check-label, .card .status-bar, .card h4 {
      color: #e8eef4 !important;
    }
    .card .form-control, .card textarea {
      background: #0e1c27;
      color: #e8eef4;
      border-color: #1e3a4d;
    }
    .card .form-control::placeholder {
      color: #7d93a6;
    }
    .card .form-control:focus {
      color: #e8eef4;
      background: #0e1c27;
    }

    @media (max-width: 600px) {
      body { overflow-x: hidden; }
      .container { display: flex; min-height: 100dvh; flex-direction: column; width: 100%; max-width: none; padding-right: 12px; padding-bottom: 82px; padding-left: 12px; }
      .container > .d-flex { flex-wrap: wrap; gap: 8px; }
      .container > .d-flex h4 { width: 100%; margin: 0; font-size: 1.05rem; }
      .container > .d-flex > div { flex-wrap: wrap; gap: 6px !important; }
      .container > .row { display: block; flex: 1; min-height: 0; margin: 0; }
      .container > .row > div { display: block; width: 100%; padding: 0; }
      .container > .row [data-mobile-panel] { display: none !important; }
      body[data-mobile-view="slides"] .container [data-mobile-panel="slides"],
      body[data-mobile-view="files"] .container [data-mobile-panel="files"],
      body[data-mobile-view="chat"] .container [data-mobile-panel="chat"],
      body[data-mobile-view="more"] .container [data-mobile-panel="more"] { display: flex !important; flex-direction: column; }
      .container > .mobile_tool_view_nav { position: fixed; right: 0; bottom: 0; left: 0; z-index: 40; }
      .card { padding: 12px !important; border-radius: 10px; }
      .card[data-mobile-panel="slides"], .card[data-mobile-panel="chat"] { min-height: calc(100dvh - 170px); }
      .card[data-mobile-panel="files"] { min-height: 55vh; }
      .card[data-mobile-panel="slides"] { min-height: 0; }
      .card > .d-flex.justify-content-between { flex-wrap: wrap; gap: 8px; }
      .card > .d-flex.justify-content-between.align-items-center.mb-2 > .d-flex.gap-1 { width: 100%; flex-wrap: wrap; }
      #active_name, #page_label { display: block; margin: 0 !important; }
      #btn_prev, #btn_next, #btn_stop_live, .card a { min-width: 0; flex: 1 1 42%; }
      .slide-frame { height: auto; min-height: 0; flex: 0 0 auto; aspect-ratio: 16 / 9; }
      #file_list { min-height: 0; max-height: 48vh; overflow-y: auto; }
      #goto_input { max-width: calc(100% - 88px); }
      #file_input { min-width: 0; }
      .chat-box { height: auto; min-height: 170px; flex: 1; }
    }
  </style>
</head>

<body data-mobile-view="slides">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4><i class="bi bi-sliders"></i> Presenter Control <span class="status-bar">(operator side)</span></h4>
      <div class="d-flex gap-2 align-items-center">
        <details class="mobile_tool_menu">
          <summary aria-label="Open system menu"><i class="bi bi-list" aria-hidden="true"></i><span>Menu</span></summary>
          <div class="mobile_tool_menu_panel">
            <a href="/"><i class="bi bi-house-door" aria-hidden="true"></i> Home</a>
            <a href="/plugin/bible/"><i class="bi bi-book" aria-hidden="true"></i> Bible</a>
            <a href="/plugin/lyrics/"><i class="bi bi-music-note-beamed" aria-hidden="true"></i> Lyrics</a>
            <a href="/plugin/timer/"><i class="bi bi-stopwatch" aria-hidden="true"></i> Timer</a>
            <a href="/plugin/live_graphics/"><i class="bi bi-broadcast" aria-hidden="true"></i> Live Graphics</a>
            <a href="/plugin/presenter/dashboard.html"><i class="bi bi-easel2" aria-hidden="true"></i> Preacher Dashboard</a>
            <a href="/plugin/presenter/"><i class="bi bi-sliders" aria-hidden="true"></i> Presenter Control</a>
          </div>
        </details>
        <span id="operator_status" class="status-bar"></span>
        <span id="conn_status" class="badge bg-secondary">connecting…</span>
        <span id="live_badge" class="badge badge-live hidden">● LIVE</span>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div class="card p-3" data-mobile-panel="slides">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <span id="active_name" class="fw-bold">Nothing loaded</span>
              <span id="page_label" class="status-bar ms-2"></span>
            </div>
            <div class="d-flex gap-1">
              <button id="btn_prev" class="btn btn-outline-light btn-sm" title="Previous slide"><i
                  class="bi bi-skip-backward"></i></button>
              <button id="btn_next" class="btn btn-light btn-sm" title="Next slide">Next <i
                  class="bi bi-skip-forward"></i></button>
              <button id="btn_stop_live" class="btn btn-outline-danger btn-sm"><i class="bi bi-stop-circle"></i> Stop
                Live</button>
              <a href="/screen/01/" target="_blank" class="btn btn-outline-info btn-sm"><i
                  class="bi bi-arrows-fullscreen"></i> Expand</a>
            </div>
          </div>
          <iframe id="slide_frame" class="slide-frame" src="about:blank"></iframe>
          <div class="input-group mt-2" style="max-width:260px">
            <input type="number" id="goto_input" class="form-control" min="1" placeholder="page #">
            <button id="btn_goto" class="btn btn-outline-light">Go to</button>
          </div>
        </div>

        <div class="card p-3 mt-3" data-mobile-panel="more">
          <h6><i class="bi bi-journal-text"></i> Preacher notes (read-only)</h6>
          <div id="notes_view" class="notes-view">—</div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card p-3 text-center" data-mobile-panel="more">
          <div class="status-bar">Service clock</div>
          <div id="clock" class="fs-3 fw-bold" style="color:#6ec1ff">--:--:--</div>
        </div>

        <div class="card p-3 mt-3" data-mobile-panel="files">
          <h6><i class="bi bi-collection"></i> Uploaded files</h6>
          <ul id="file_list" class="list-group"></ul>
          <div class="input-group mt-2">
            <input type="file" id="file_input" class="form-control form-control-sm" accept=".ppt,.pptx,.pdf">
            <button id="btn_upload" class="btn btn-sm btn-primary"><i class="bi bi-upload"></i></button>
          </div>
        </div>

        <div class="card p-3 mt-3" data-mobile-panel="chat">
          <h6><i class="bi bi-chat-dots"></i> Chat with preacher</h6>
          <div id="chat_box" class="chat-box mb-2"></div>
          <div class="input-group">
            <input type="text" id="chat_input" class="form-control" placeholder="Message…">
            <button id="btn_chat_send" class="btn btn-outline-warning"><i class="bi bi-send"></i></button>
          </div>
        </div>
      </div>
    </div>
    <nav class="mobile_tool_view_nav" aria-label="Presenter views">
      <button type="button" data-mobile-view-button="slides" class="active" aria-current="page"><i class="bi bi-easel" aria-hidden="true"></i><span>Slides</span></button>
      <button type="button" data-mobile-view-button="files"><i class="bi bi-collection" aria-hidden="true"></i><span>Files</span></button>
      <button type="button" data-mobile-view-button="chat"><i class="bi bi-chat-dots" aria-hidden="true"></i><span>Chat</span></button>
      <button type="button" data-mobile-view-button="more"><i class="bi bi-three-dots" aria-hidden="true"></i><span>More</span></button>
    </nav>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/control.js"></script>
  <script src="/js/mobile-system.js"></script>
</body>

</html>
