<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Now & Next</title>
        <style>
            :root{
            --color-dark: #161617;
            --color-dark2: #232323;
            --color-light: #f4f4f4;
            --color-accent: #484d53;
            --color-orange: #f8993f;
            --color-red: #ff4d4d;
            --color-green: #33cc33;
        }
        @font-face {
            font-family: 'BelaBereka';
            src: url('../../font/BelaBereka.ttf');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Agbalumo';
            src: url('../../font/Agbalumo-Regular.ttf');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Menbere';
            src: url('../../font/Menbere-VariableFont_wght.ttf');
            font-weight: normal;
            font-style: normal;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            position: absolute;
            top:0;
            left:0;
            width: 1920px;
            height: 1080px;
        }
        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            transform: translateY(-9rem);
            padding: 50px;
            transition: all 0.5s ease-in-out;
        }

        .title {
            position: absolute;
            top: 75px;
            left: 100px;
            display: flex;
            font-family: 'Agbalumo';
            width: 125px;
            font-size: 1.5rem;
            gap: 20px;
            background-color: var(--color-dark2);
            padding: 10px 20px;
            border-radius: 5px;
            overflow: hidden;
            flex-direction: column;
            height: 3.5rem;
            transition: all 0.5s ease-in-out;
            flex-direction: column;
        }
        .title_n {
            color: var(--color-light);
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
             transition: all 0.5s ease-in-out;
        }
        .content {
            position: absolute;
            top: 75px;
            left: 220px;
            display: flex;
            font-family: 'Agbalumo';
            width: max-content;
            font-size: 1.5rem;
            gap: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            overflow: hidden;
            flex-direction: column;
            height: 3.5rem;
            z-index: -1;
            border-radius: 0 5px 5px 0;
        }
        .now_content, .next_content {
            color: var(--color-light);
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            text-align: left;
            transition: all 0.5s ease-in-out;
        }
        .now_content {
            transition: all 0.5s ease-in-out;
            
        }
        .next_content {
            transition: all 0.5s ease-in-out;
        }
        </style>
    </head>
    <body>
        <div class="container" id="container">
            <div class="title">
                <div class="now_title title_n" id="now_title">አሁን</div>
                <div class="next_title title_n" id="next_title">ቀጣይ</div>
            </div>
            <div class="content">
                <div class="now_content" id="now_content">የቃል ጊዘ </div>
                <div class="next_content" id="next_content">የመዘምራን አገልግሎት</div>
            </div>
        </div>
        <script src="/socket.io/socket.io.js"></script>
        <script>
            const socket = io();
            const nowContent = document.getElementById('now_content');
            const nextContent = document.getElementById('next_content');
            const nowTitle = document.getElementById('now_title');
            const nextTitle = document.getElementById('next_title');
            const container = document.getElementById('container');

            
            // animation function to slide the content up and down
            function slideContent() {
                // nowContent.style.transform = 'translateY(-3.5rem)';
                // nextContent.style.transform = 'translateY(-3.5rem)';
                setTimeout(() => {
                    nowTitle.style.transform = 'translateY(-3.5rem)';
                    nextTitle.style.transform = 'translateY(-3.5rem)';
                }, 5000);
                setTimeout(() => {
                    nowContent.style.transform = 'translateY(-3.5rem)';
                    nextContent.style.transform = 'translateY(-3.5rem)';
                }, 5100);
            }
            function slideContentin() {
                nowTitle.style.transform = 'translateY(0)';
                nextTitle.style.transform = 'translateY(0)';
                nowContent.style.transform = 'translateY(0)';
                nextContent.style.transform = 'translateY(0)';
            }
            // call the function when the page loads
            slideContent();

            socket.on('receive_command', (data) => {
                // nowContent.innerHTML = data.now;
                // nextContent.innerHTML = data.next;
                //slideContent();
                console.log(data);
                if(data.cmd == "now_next_text"){
                    if(data.now_text_status==1){
                        let now_text = data.now_text;
                        nowContent.innerHTML = now_text;
                        let next_text = data.next_text;
                        nextContent.innerHTML = next_text;
                        slideContentin();
                        slideContent();
                        container_slide_down();
                    }
                   
                }
            });

            //container.style.transform='translateY(-9rem)';
            function container_slide_up(){
                container.style.transform='translateY(-9rem)';
                
            }
            function container_slide_down(){
                container.style.transform='translateY(0)';
                setTimeout(() => {
                    container_slide_up();
                 }, 9000);
            }
        </script>
    </body>
</html>
