<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Plate Properties</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-1: #070b14;
            --bg-2: #101827;
            --panel: rgba(15, 23, 42, 0.7);
            --panel-strong: rgba(15, 23, 42, 0.84);
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(148, 163, 184, 0.22);
            --text: #edf6ff;
            --muted: #a7b8d8;
            --orange: #f8a75a;
            --gold: #f9d976;
            --green: #34d399;
            --blue: #60a5fa;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #070b14 0%, #0f172a 60%, #111827 100%);
            color: var(--text);
        }

        body {
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
            padding: 16px 12px 12px;
            gap: 14px;
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.14), transparent 30%),
                radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.16), transparent 24%);
        }

        .title {
            position: relative;
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: linear-gradient(90deg, rgba(96, 165, 250, 0.18), rgba(139, 92, 246, 0.18));
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            padding: 10px 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
            overflow: hidden;
            gap: 16px;
            background: rgba(15, 23, 42, 0.38);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 18px 28px rgba(2, 6, 23, 0.24);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .add_new_name {
            position: relative;
            display: flex;
            width: 100%;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 12px;
            color: var(--text);
        }

        .property_item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 150px;
            flex: 1;
        }

        .property_item label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .add_new_name input[type="text"] {
            width: 100%;
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.72);
            color: var(--text);
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .add_new_name input[type="text"]:focus {
            border-color: rgba(248, 167, 90, 0.8);
            box-shadow: 0 0 0 3px rgba(248, 167, 90, 0.14);
        }

        .add_new_name button {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.9), rgba(139, 92, 246, 0.72));
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            min-width: 110px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 20px rgba(96, 165, 250, 0.18);
        }

        .add_new_name button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(96, 165, 250, 0.24);
        }

        .name_list {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.14);
            background: rgba(15, 23, 42, 0.48);
        }

        .name_list table {
            width: 100%;
            border-collapse: collapse;
            border: none;
        }

        .name_list table th,
        .name_list table td {
            padding: 10px 12px;
            text-align: left;
            max-height: 30px;
            user-select: none;
        }

        .name_list table th {
            background: linear-gradient(90deg, rgba(96, 165, 250, 0.2), rgba(139, 92, 246, 0.16));
            color: var(--text);
            height: 36px;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        }

        .name_list table tbody tr {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .name_list table tbody tr:hover {
            background: rgba(30, 41, 59, 0.84);
        }

        .name_list table tbody tr td {
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            Name Plate Properties
        </div>
        <div class="content">
            <div class="add_new_name">
                <div class="property_item">
                    <label for="name_text">Name:</label>
                    <input type="text" id="name_text" placeholder="Enter name">
                </div>
                <div class="property_item">
                    <label for="title_text">Title:</label>
                    <input type="text" id="title_text" placeholder="Enter title">
                </div>
                <div class="property_item">
                    <button id="add_btn"><i class="bi bi-plus-circle-fill"></i> Add</button>
                </div>
                 <div class="property_item">
                    <button id="import_btn"><i class="bi bi-file-earmark-arrow-down-fill"></i> Import</button>
                    <input type="file" id="import_file" style="display:none"/>
                </div>
            </div>
            <div class="name_list">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Title</th>
                        </tr>
                    </thead>
                    <tbody id="name_list_body">
                        <tr onclick="selectName(0)">
                            <td>John Doe</td>
                            <td>Pastor</td>
                        </tr>
                        <tr>
                            <td>Jane Smith</td>
                            <td>Choir Director</td>
                        </tr>
                    </tbody>
                </table>
            </div>
    </div>
</body>
<script src="../../../lyrics/js/xlsx.full.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let nameList = [];
    const nameText = document.getElementById("name_text");
    const titleText = document.getElementById("title_text");
    const addBtn = document.getElementById("add_btn");
    const nameListBody = document.getElementById("name_list_body");
    addBtn.addEventListener("click", () => {
        const name = nameText.value;
        const title = titleText.value;
        if(name && title){
            nameList.push({name, title});
            displayNameList();
            nameText.value = "";
            titleText.value = "";
        }
    });
    function selectName(index){
        const name = nameList[index].name;
        const title = nameList[index].title;
        // send to server to display on name plate
        // nameText.value = name;
        // titleText.value = title;
        sendCommand({cmd:"name_plate_text", name, title});
    }
    // display the name list in the table
    function displayNameList(){
        nameListBody.innerHTML = "";
        nameList.forEach((item, index) => {
            nameListBody.innerHTML += `<tr onclick="selectName(${index})"><td>${item.name}</td><td>${item.title}</td></tr>`;
        });
    }
    displayNameList();
    const importBtn = document.getElementById("import_btn");
    const importFile = document.getElementById("import_file");
    importBtn.addEventListener("click", () => {
        importFile.click();
    });
    importFile.addEventListener("change", (event) => {
        // decode excel file and get the data
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = e.target.result;
            const workbook = XLSX.read(data, {type: 'binary'});
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(sheet);
            json.forEach((item) => {
                nameList.push({name: item.Name, title: item.Title});
            });
            displayNameList();
        };
        reader.readAsBinaryString(file);
    });
    function sendCommand(command) {
        socket.emit("command", command);
    }       
</script>
</html>
</script>
</html>
