<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>
            if (window.matchMedia('(max-width: 600px)').matches) {
                window.location.replace('/plugin/bible/mobile/');
            }
        </script>
        <title>Bible Browser</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="/css/presentation-nav.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv" crossorigin="anonymous">
    </head>
    </head>
    <body>
        <nav class="plugin_nav" aria-label="Plugin navigation">
            <a href="/" aria-label="Main page"><i class="bi bi-house-door"></i> Home</a>
            <a href="/plugin/presenter/dashboard.html" aria-label="Preacher Dashboard for PPT and PDF"><i class="bi bi-easel2"></i> Preacher Dashboard</a>
            <a href="/plugin/presenter/" aria-label="Presenter Control"><i class="bi bi-sliders"></i> Presenter Control</a>
            <a href="/plugin/bible/" class="active" aria-label="Bible plugin"><i class="bi bi-book"></i> Bible</a>
            <a href="/plugin/lyrics/" aria-label="Lyrics plugin"><i class="bi bi-music-note-beamed"></i> Lyrics</a>
            <a href="/plugin/timer/" aria-label="Timer plugin"><i class="bi bi-stopwatch"></i> Timer</a>
            <a href="/plugin/live_graphics/" aria-label="Live Graphics plugin"><i class="bi bi-broadcast"></i> Live Graphics</a>
            <button type="button" class="presentation_extend" data-presentation-open aria-label="Extend Screen 01 presentation to another monitor"><i class="bi bi-arrows-fullscreen" aria-hidden="true"></i> Extend</button>
        </nav>
        <div class="header">
            <div class="logo_name">
                <div class="logo">
                    <img src="../assets/logo.png" alt="">
                </div>
                <div class="title">
                    Bible Browser
                </div>
                <div class="books">
                    <select class="form-select" id="translation_books" aria-label="Select Book">
                        <option value="">Select Book</option>
                    </select>
                 </div>
            </div>
            <div class="clock" id="clock">00:00 AM</div>
        </div>
        <div class="container">
            <div class="left_side">
                 <div class="old_new">
                    <div>Old Testament</div>
                    <div>New Testament</div>
                 </div>
                 <div class="books_list">
                    <div class="books_old">
                        <ul id="books_old">
                            
                        </ul>
                    </div>
                    <div class="books_new">
                        <ul id="books_new">
                            
                        </ul>
                    </div>
                 </div>
                 <div class="chapter_number" id="chapter_number">
                
                 </div>
            </div>
            <div class="middel_side">
                <div class="selected_chapter" id="selected_chapter">ዘፍጥረት 1</div>
                <div class="versus_list" id="versus_list">
                </div>
                <div class="controls_btn">
                    <div class="previous">
                        <button id="btn_previous"><i class="bi bi-arrow-left"></i> Previous</button>
                    </div>
                    <div class="show">
                        <button class="btn_show" id="btn_show"><i class="bi bi-eye"></i> Show</button>
                    </div>
                    <div class="next">
                        <button id="btn_next">Next <i class="bi bi-arrow-right"></i></button>
                    </div>
                    <div class="add_to_queue">
                        <button id="btn_add_to_queue"><i class="bi bi-plus-circle"></i> Queue</button>
                    </div>

                </div>
            </div>
            <div class="right_side">
                <div class="Preview">
                    <lable>Preview</lable>
                    <iframe src="main/" frameborder="0"></iframe>
                </div>
                <div class="queue_list">
                    <div class="queue_tabs">
                        <button class="queue_tab active" id="tab_queue" onclick="switchRightTab('queue')">Queue</button>
                        <button class="queue_tab" id="tab_history" onclick="switchRightTab('history')">History</button>
                        <button class="queue_tab" id="tab_search" onclick="switchRightTab('search')">Search</button>
                        <button class="queue_tab" id="tab_property" onclick="switchRightTab('property')">Properties</button>
                    </div>
                    <ul id="queue_list">
                        
                    </ul>
                    <ul id="history_list" style="display: none;">
                        
                    </ul>
                    <div id="search_container" style="display:none;">
                        <form id="bible_search_form" class="bible_search_form">
                            <input id="bible_search_input" type="search" placeholder="Search selected translation…" aria-label="Search selected translation" autocomplete="off">
                            <button type="submit" class="bible_search_button" aria-label="Search"><i class="bi bi-search"></i></button>
                        </form>
                        <div id="bible_search_status" role="status" aria-live="polite">Search across the selected translation.</div>
                        <ul id="search_results" aria-label="Search results"></ul>
                    </div>
                    <div id="property_container" style="display: none; width: 100%; height: 100%;">
                        <iframe src="property.html" frameborder="0" style="width: 100%; height: 100%; border: none; border-radius: 5px;"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/script.js"></script>
    <script src="/js/presentation-nav.js"></script>
</html>
